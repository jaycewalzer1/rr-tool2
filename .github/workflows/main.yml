name: Build and Deploy Docker App to EC2

on:
  push:
    branches:
      - main

env:
  REGION: us-east-1
  REPO: cre
  IMAGE_TAG: latest

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.REGION }}

      - name: Login to ECR
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "ACCOUNT_ID=$ACCOUNT_ID" >> $GITHUB_ENV
          aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $ACCOUNT_ID.dkr.ecr.$REGION.amazonaws.com

      - name: Build, Tag, and Push Docker Image to ECR
        run: |
          docker build -t $REPO:$IMAGE_TAG .
          docker tag $REPO:$IMAGE_TAG $ACCOUNT_ID.dkr.ecr.$REGION.amazonaws.com/$REPO:$IMAGE_TAG
          docker push $ACCOUNT_ID.dkr.ecr.$REGION.amazonaws.com/$REPO:$IMAGE_TAG

      - name: SSH into EC2 and Deploy Container + Run Tests
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            REGION=us-east-2
            REPO=cre
            IMAGE_TAG=latest
            ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text --region $REGION)
            
            # Install dependencies
            sudo apt update
            sudo apt install -y docker.io git python3 python3-pip unzip curl
            
            # Install AWS CLI v2
            curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
            unzip -q awscliv2.zip
            sudo ./aws/install --update
            
            # Docker login & pull
            aws ecr get-login-password --region $REGION | sudo docker login --username AWS --password-stdin $ACCOUNT_ID.dkr.ecr.$REGION.amazonaws.com
            sudo docker pull $ACCOUNT_ID.dkr.ecr.$REGION.amazonaws.com/$REPO:$IMAGE_TAG
            
            # Kill existing container
            if sudo docker ps -a --format '{{.Names}}' | grep -Eq '^cre_app$'; then
              sudo docker stop cre_app
              sudo docker rm cre_app
            fi
            
            # Run new container
            sudo docker run -d -p 80:5000 --name cre_app $ACCOUNT_ID.dkr.ecr.$REGION.amazonaws.com/$REPO:$IMAGE_TAG
            
            # Clone repo
            if [ ! -d "rr-tool2" ]; then
              git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/jaycewalzer1/rr-tool2.git
            fi
            cd rr-tool2
            
            # Install dependencies
            python3 -m venv venv
            source venv/bin/activate
            pip install -r requirements.txt
            
            # Run tests
            if [ -d "tests" ]; then
              for file in tests/*.py; do
                python "$file"
              done
            fi
