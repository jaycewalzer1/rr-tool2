[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "rent-roll-tool"
version = "1.0.0"
description = "OCR pipeline and web app that turns commercial rent roll PDFs into structured tenant comparables."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }

dependencies = [
    "Flask==3.0.0",
    "Flask-WTF==1.2.1",
    "Flask-Session==0.5.0",
    "Flask-SQLAlchemy==3.1.1",
    "SQLAlchemy==2.0.25",
    "Jinja2==3.1.3",
    "Werkzeug==3.0.1",
    "python-dotenv==1.0.0",
    "email-validator==2.1.0.post1",
    "cachelib==0.13.0",
    "stripe==9.5.0",
    "boto3==1.29.0",
    "botocore==1.32.0",
    "PyMuPDF==1.24.1",
    "pytesseract==0.3.10",
    "Pillow==10.1.0",
    "pandas==2.2.2",
    "numpy==1.26.2",
    "openpyxl==3.1.2",
    "gunicorn==21.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.0",
    "pytest-cov==5.0.0",
    "ruff==0.5.0",
    "mypy==1.10.0",
    "pre-commit==3.7.0",
    "types-pytz",
    "pandas-stubs",
]

[tool.setuptools]
py-modules = [
    "app",
    "auth",
    "config",
    "decorators",
    "forms",
    "logging_config",
    "models",
    "pipeline",
    "storage",
    "utils",
    "wsgi",
]

[tool.setuptools.packages.find]
include = ["routes*", "tenant_parser*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # bugbear
    "S",    # bandit security checks
    "C4",   # comprehensions
    "SIM",  # simplifications
    "RET",  # return statements
    "PTH",  # prefer pathlib
    "RUF",
]
ignore = [
    "S101",  # assert is the point of a test suite
    "B008",  # Flask/WTForms idiomatically call in defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]  # hard-coded test credentials are intentional

[tool.mypy]
python_version = "3.12"
# The test suite is checked by pytest, not by mypy: annotating fixtures and
# monkeypatch doubles to mypy's satisfaction adds noise without catching bugs.
exclude = ["^tests/", "^\\.venv/"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
check_untyped_defs = true

[[tool.mypy.overrides]]
# These ship no type information.
module = [
    "boto3.*",
    "botocore.*",
    "fitz.*",
    "flask_session.*",
    "flask_wtf.*",
    "openpyxl.*",
    "pandas.*",
    "pymupdf.*",
    "pytesseract.*",
    "stripe.*",
    "wtforms.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# The app is a set of top-level modules, so the suite runs from a clean
# checkout without needing an editable install first.
pythonpath = ["."]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]
