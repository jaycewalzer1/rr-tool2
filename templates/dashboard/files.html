{% extends "dashboard_wrapper.html" %}

{% block dashboard_title %}File Management - CRE: AI Solutions{% endblock %}

{% block dashboard_content %}
    <div class="section-header">File Management</div>

    <div id="drop-zone" class="drop-zone">
        <div class="drop-zone-inner">
            <img src="{{ url_for('static', filename='img/upload_icon.svg') }}" alt="Upload" class="upload-icon">
            <p>Drag & Drop files here</p>
            <button type="button" class="browse-button" onclick="document.getElementById('fileInput').click()">Browse Files</button>
            <input type="file" id="fileInput" hidden>
        </div>
    </div>


    <div class="list-box">
        <h3>Your Files</h3>
        <div id="filesList">
            <!-- Files will be listed here -->
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const dropZone = document.getElementById('drop-zone');
            const fileInput = document.getElementById('fileInput');
        
            // Drag logic
            dropZone.addEventListener('dragover', (e) => {
                e.preventDefault();
                dropZone.classList.add('dragover');
            });
        
            dropZone.addEventListener('dragleave', () => {
                dropZone.classList.remove('dragover');
            });
        
            dropZone.addEventListener('drop', (e) => {
                e.preventDefault();
                dropZone.classList.remove('dragover');
                const file = e.dataTransfer.files[0];
                if (file) handleUpload(file);
            });
        
            fileInput.addEventListener('change', () => {
                const file = fileInput.files[0];
                if (file) handleUpload(file);
            });
        
            async function handleUpload(file) {
                try {
                    const res = await fetch('/api/s3/upload-url', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ filename: file.name })
                    });
        
                    const data = await res.json();
                    await fetch(data.upload_url, {
                        method: 'PUT',
                        headers: { 'Content-Type': file.type },
                        body: file
                    });
        
                    await fetch('/api/s3/files', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            filename: file.name,
                            s3_key: data.s3_key,
                            content_type: file.type,
                            size_bytes: file.size
                        })
                    });
        
                    alert('Upload successful');
                    loadFiles(); // reload list
                } catch (err) {
                    console.error(err);
                    alert('Upload failed');
                }
            }
        
            async function loadFiles() {
                const filesList = document.getElementById('filesList');
                const res = await fetch('/api/local/files');
                const data = await res.json();
                filesList.innerHTML = '';
                data.files.forEach(file => {
                    const div = document.createElement('div');
                    div.textContent = file.filename;
                    filesList.appendChild(div);
                });
            }
        
            loadFiles();
        });
        </script>        
{% endblock %}
