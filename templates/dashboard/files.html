{% extends "dashboard_wrapper.html" %}

{% block dashboard_title %}File Management - CRE: AI Solutions{% endblock %}

{% block dashboard_content %}
    <div class="section-header">File Management</div>

    <div id="drop-zone" class="drop-zone">
        <div class="drop-zone-inner">
            <img src="{{ url_for('static', filename='img/upload_icon.svg') }}" alt="Upload" class="upload-icon">
            <p>Drag & Drop files here</p>
            <button type="button" class="browse-button" onclick="document.getElementById('fileInput').click()">Browse Files</button>
            <input type="file" id="fileInput" hidden>
        </div>
    </div>


    <div class="list-box">
        <h3>Your Files</h3>
        <div id="filesList">
            <!-- Files will be listed here -->
        </div>
    </div>

    <!-- Loading Overlay -->
    <div id="loading-overlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.4); z-index:1000; justify-content:center; align-items:center;">
        <div id="loading-popup" style="background:#fff; color:#000; padding:30px 40px; border-radius:12px; box-shadow:0 4px 15px rgba(0,0,0,0.3); text-align:center;">
            <h3 style="margin-bottom: 20px;">Processing...</h3>
            <div class="spinner"></div>
        </div>
    </div>
    
    <style>
    .spinner {
        margin: 0 auto;
        width: 40px;
        height: 40px;
        border: 5px solid #ddd;
        border-top-color: #007bff;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
        to { transform: rotate(360deg); }
    }
    </style>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const dropZone = document.getElementById('drop-zone');
            const fileInput = document.getElementById('fileInput');
        
            // Drag logic
            dropZone.addEventListener('dragover', (e) => {
                e.preventDefault();
                dropZone.classList.add('dragover');
            });
        
            dropZone.addEventListener('dragleave', () => {
                dropZone.classList.remove('dragover');
            });
        
            dropZone.addEventListener('drop', (e) => {
                e.preventDefault();
                dropZone.classList.remove('dragover');
                const file = e.dataTransfer.files[0];
                if (file) handleUpload(file);
            });
        
            fileInput.addEventListener('change', () => {
                const file = fileInput.files[0];
                if (file) handleUpload(file);
            });
        
            async function handleUpload(file) {
                const overlay = document.getElementById('loading-overlay');
                overlay.style.display = 'flex';  // Show loading

                try {
                    const res = await fetch('/api/s3/upload-url', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ filename: file.name })
                    });
        
                    const data = await res.json();
                    await fetch(data.upload_url, {
                        method: 'PUT',
                        headers: { 'Content-Type': file.type },
                        body: file
                    });
        
                    await fetch('/api/s3/files', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            filename: file.name,
                            s3_key: data.s3_key,
                            content_type: file.type,
                            size_bytes: file.size
                        })
                    });
        
                    alert('Upload successful');
                    loadFiles(); // reload list
                } catch (err) {
                    console.error(err);
                    alert('Upload failed');
                } finally {
                    overlay.style.display = 'none';  // Hide loading
                }
            }
        
            async function loadFiles() {
                const filesList = document.getElementById('filesList');
                const res = await fetch('/api/s3/files');
                const data = await res.json();
                filesList.innerHTML = '';
                data.files.forEach(file => {
                    const container = document.createElement('div');

                    const link = document.createElement('a');
                    link.href = file.public_url;
                    link.textContent = file.filename;
                    link.target = '_blank';
                    link.rel = 'noopener noreferrer';

                    container.appendChild(link);
                    filesList.appendChild(container);
                });
            }
        
            loadFiles();
        });
        </script>        
{% endblock %}
