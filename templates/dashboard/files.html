{% extends "dashboard_wrapper.html" %}

{% block dashboard_title %}File Management - CRE: AI Solutions{% endblock %}

{% block dashboard_content %}
    <div class="section-header">File Management</div>

    <form id="uploadForm" action="{{ url_for('upload_rent_roll') }}" method="POST" enctype="multipart/form-data">
        <div class="drop-zone" id="drop-zone">
            <div class="drop-zone-inner">
                <img src="{{ url_for('static', filename='img/upload_icon.svg') }}" alt="Upload" class="upload-icon">
                <p>Drag & Drop files here</p>
                <input type="file" id="fileInput" name="pdf" accept="application/pdf" required>
                <button type="submit" class="browse-button">Upload</button>
            </div>
        </div>
    </form>
    
      

    <div class="list-box">
        <h3>Your Files</h3>
        <div id="filesList">
            <!-- Files will be listed here -->
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const dropZone = document.getElementById('drop-zone');
            const fileInput = document.getElementById('fileInput');
            const form = document.getElementById('uploadForm');
        
            // Helper: Upload file via fetch
            async function uploadFile(file) {
                const formData = new FormData();
                formData.append('pdf', file);
        
                try {
                    const response = await fetch(form.action, {
                        method: 'POST',
                        body: formData
                    });
        
                    if (!response.ok) {
                        const text = await response.text();
                        throw new Error(`Upload failed: ${response.status} - ${text}`);
                    }
        
                    window.location.reload(); // Refresh page on success
                } catch (err) {
                    alert('Upload failed: ' + err.message);
                    console.error(err);
                }
            }
        
            // Handle drag and drop
            dropZone.addEventListener('dragover', (e) => {
                e.preventDefault();
                dropZone.classList.add('dragover');
            });
        
            dropZone.addEventListener('dragleave', () => {
                dropZone.classList.remove('dragover');
            });
        
            dropZone.addEventListener('drop', (e) => {
                e.preventDefault();
                dropZone.classList.remove('dragover');
                const file = e.dataTransfer.files[0];
                if (file) uploadFile(file);
            });
        
            // Handle browse
            fileInput.addEventListener('change', () => {
                if (fileInput.files.length > 0) {
                    uploadFile(fileInput.files[0]);
                }
            });
        });
        </script>
        
          
{% endblock %}
