{% extends "dashboard_wrapper.html" %}

{% block dashboard_title %}Google Maps - CRE: AI Solutions{% endblock %}

{% block extra_scripts %}
    <!-- Define initMap inline BEFORE Maps API loads -->
    <script>
        window.initMap = function () {
            if (typeof initializeMap === 'function') {
                initializeMap();
            }
        };
    </script>

    <!-- Load your JS -->
    <script src="{{ url_for('static', filename='js/gmaps.js') }}"></script>

    <!-- Load Google Maps JS API -->
    <script async defer
        src="https://maps.googleapis.com/maps/api/js?key={{ GOOGLE_MAPS_API_KEY }}&libraries=maps&callback=initMap">
    </script>

    <!-- Load Web Components for Place Autocomplete -->
    <script type="module" src="{{ url_for('static', filename='js/gmaps-loader.js') }}"></script>

{% endblock %}

{% block dashboard_content %}
    <div class="map-container">
        <div class="search-container">
        </div>

        <div id="map" style="height: 600px; width: 100%;"></div>
        <div id="mapLoader" style="display: none; text-align: center; padding: 10px;">
            <em>Loading...</em>
        </div>
    </div>
{% endblock %}

{% block extra_styles %}
    <style>
        .map-container {
            margin-top: 20px;
        }

        .search-container {
            margin-bottom: 20px;
            padding: 10px;
            background-color: #f5f5f5;
            border-radius: 5px;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .search-container input[type="text"] {
            flex-grow: 1;
            padding: 8px 12px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
            outline: none;
            transition: border-color 0.3s ease;
        }

        .search-container input[type="text"]:focus {
            border-color: #007bff;
            box-shadow: 0 0 5px rgba(0, 123, 255, 0.5);
        }

        .search-container button {
            padding: 8px 16px;
            font-size: 16px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .search-container button:hover {
            background-color: #0056b3;
        }
    </style>
{% endblock %}
