{% extends "dashboard_wrapper.html" %}

{% block dashboard_title %}Google Maps - CRE: AI Solutions{% endblock %}

{% block extra_scripts %}
    <!-- Define initMap inline BEFORE Maps API loads -->
    <script>
        window.initMap = function () {
            if (typeof initializeMap === 'function') {
                initializeMap();
            }
        };
    </script>

    <!-- Load your JS -->
    <script src="{{ url_for('static', filename='js/gmaps.js') }}"></script>

    <!-- Load Google Maps JS API -->
    <script
      src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAf-BOMf4RE26r8XenLvtLBHkUnB9DHAQM&libraries=places&callback=initMap"
      async
      defer>
    </script>


    <!-- Load Web Components for Place Autocomplete -->
    <script 
        type="module" src="https://maps.googleapis.com/maps/api/plus/js">
    </script>

{% endblock %}

{% block dashboard_content %}
    <div class="map-container">
        <div class="search-container">
            <!-- NEW: Modern Place Autocomplete -->
            <gmpx-place-autocomplete
                id="autocomplete"
                style="width: 100%;"
                placeholder="Enter an address">
            </gmpx-place-autocomplete>

            <form id="addressForm" style="margin-top: 10px;">
                <button type="submit">Add Marker</button>
            </form>
        </div>

        <div id="map" style="height: 600px; width: 100%;"></div>
        <div id="mapLoader" style="display: none; text-align: center; padding: 10px;">
            <em>Loading...</em>
        </div>
    </div>
{% endblock %}

{% block extra_styles %}
    <style>
        .map-container {
            margin-top: 20px;
        }

        .search-container {
            margin-bottom: 20px;
            padding: 10px;
            background-color: #f5f5f5;
            border-radius: 5px;
        }

        gmpx-place-autocomplete {
            display: block;
            height: 40px;
            margin-bottom: 8px;
            font-family: inherit;
        }

        #addressForm {
            display: flex;
            justify-content: flex-start;
        }

        #addressForm button {
            padding: 8px 16px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 500;
        }

        #addressForm button:hover {
            background-color: #45a049;
        }

        #mapLoader {
            font-size: 14px;
            color: #888;
        }
    </style>
{% endblock %}
