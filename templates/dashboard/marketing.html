{% extends "dashboard_wrapper.html" %}

{% block dashboard_title %}Marketing Materials - CRE: AI Solutions{% endblock %}

{% block dashboard_content %}
    <div class="main">
        <div class="section-header">Marketing Materials</div>
        <div class="upload-box">
            <h3>Upload PDF</h3>
            <form id="uploadForm" enctype="multipart/form-data">
                <div class="form-group">
                    <input type="file" name="pdf" accept="application/pdf" required class="form-input">
                </div>
                <button type="submit" class="cta-button">Upload</button>
            </form>
        </div>
        <div class="list-box">
            <h3>Your PDFs</h3>
            <div id="pdfList">
                <!-- PDFs will be listed here -->
            </div>
        </div>
    </div>
{% endblock %}

{% block extra_scripts %}
    <script src="{{ url_for('static', filename='js/marketing.js') }}"></script>
{% endblock %}

{% block scripts %}
    <script>
    document.addEventListener('DOMContentLoaded', function() {
        // Load user's PDFs when page loads
        loadPDFs();

        // Handle PDF upload
        document.getElementById('uploadForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const fileInput = document.querySelector('input[type="file"][name="pdf"]');
            const file = fileInput.files[0];

            if (!file) {
                console.error('No file selected');
                alert('Please select a PDF file');
                return;
            }

            console.log('=== UPLOAD PROCESS STARTED ===');
            console.log('Selected file:', {
                name: file.name,
                size: file.size,
                type: file.type
            });

            try {
                // Get presigned upload URL
                console.log('=== REQUESTING UPLOAD URL ===');
                const response = await fetch('/api/s3/upload-url', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ filename: file.name })
                });

                console.log('=== UPLOAD URL RESPONSE ===');
                console.log('Status:', response.status);
                console.log('Response:', await response.text());

                if (!response.ok) {
                    throw new Error('Failed to get upload URL');
                }

                const data = await response.json();
                const uploadUrl = data.upload_url;
                const s3Key = data.s3_key;

                console.log('=== GOT UPLOAD URL ===');
                console.log('S3 Key:', s3Key);
                console.log('Upload URL:', uploadUrl);

                // Upload file to S3
                console.log('=== UPLOADING TO S3 ===');
                const uploadResponse = await fetch(uploadUrl, {
                    method: 'PUT',
                    body: file,
                    headers: {
                        'Content-Type': file.type
                    }
                });

                console.log('=== S3 UPLOAD RESPONSE ===');
                console.log('Status:', uploadResponse.status);
                console.log('Response:', await uploadResponse.text());

                if (!uploadResponse.ok) {
                    throw new Error('Failed to upload file');
                }

                // Add file to database
                console.log('=== SAVING TO DATABASE ===');
                await fetch('/api/s3/files', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        filename: file.name,
                        s3_key: s3Key,
                        content_type: file.type,
                        size_bytes: file.size
                    })
                });

                // Clear file input and reload PDFs
                fileInput.value = '';
                loadPDFs();

                console.log('=== UPLOAD COMPLETED SUCCESSFULLY ===');
                alert('PDF uploaded successfully!');
            } catch (error) {
                console.error('=== UPLOAD ERROR ===');
                console.error('Error:', error);
                console.error('Message:', error.message);
                alert('Error uploading PDF: ' + error.message);
            }
        });

        // Function to load PDFs
        async function loadPDFs() {
            console.log('=== LOADING PDFS ===');
            try {
                const response = await fetch('/api/local/files');
                console.log('=== PDFS RESPONSE ===');
                console.log('Status:', response.status);
                console.log('Response:', await response.text());

                if (!response.ok) {
                    throw new Error('Failed to load PDFs');
                }

                const files = await response.json();
                const pdfList = document.getElementById('pdfList');
                pdfList.innerHTML = '';

                console.log('=== PDFS LOADED ===');
                console.log('Number of files:', files.files.length);
                console.log('Files:', files.files);

                if (files.files.length === 0) {
                    pdfList.innerHTML = '<p class="text-muted">No PDFs uploaded yet.</p>';
                    return;
                }

                files.files.forEach(file => {
                    const fileElement = document.createElement('div');
                    fileElement.className = 'pdf-item mb-2';
                    fileElement.innerHTML = `
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <strong>${file.filename}</strong>
                                <small class="text-muted">Uploaded: ${new Date(file.upload_date * 1000).toLocaleString()}</small>
                                <small class="text-muted">Size: ${Math.round(file.size_bytes / 1024)} KB</small>
                            </div>
                            <div>
                                <button class="btn btn-sm btn-primary me-2" onclick="viewPDF('${file.filename}')">View</button>
                                <button class="btn btn-sm btn-danger" onclick="deletePDF('${file.filename}')">Delete</button>
                            </div>
                        </div>
                    `;
                    pdfList.appendChild(fileElement);
                });
            } catch (error) {
                console.error('=== PDFS ERROR ===');
                console.error('Error:', error);
                console.error('Message:', error.message);
                alert('Error loading PDFs: ' + error.message);
            }
        }

        // Function to view PDF
        async function viewPDF(filename) {
            try {
                // For local files, we'll just create a URL to the file
                const user_id = document.getElementById('user_id').value;
                const filePath = `/uploads/${user_id}/${filename}`;
                
                // Open the PDF in a new tab
                window.open(filePath, '_blank');
            } catch (error) {
                console.error('Error viewing PDF:', error);
                alert('Error viewing PDF: ' + error.message);
            }
        }

        // Function to delete PDF
        async function deletePDF(filename) {
            if (!confirm('Are you sure you want to delete this PDF?')) {
                return;
            }

            try {
                const response = await fetch(`/api/local/delete/${encodeURIComponent(filename)}`, {
                    method: 'DELETE',
                    headers: {
                        'Content-Type': 'application/json',
                    }
                });

                if (!response.ok) {
                    throw new Error('Failed to delete PDF');
                }

                alert('PDF deleted successfully');
                loadPDFs();
            } catch (error) {
                console.error('Error deleting PDF:', error);
                alert('Error deleting PDF: ' + error.message);
            }
        }
    });
    </script>
{% endblock %}
