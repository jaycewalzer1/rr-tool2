{% extends "base.html" %}

{% block content %}
<div class="container mt-5">
    <h2>File Management</h2>
    
    <div class="row mt-4">
        <div class="col-md-6">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">Upload File</h5>
                    <form id="uploadForm" enctype="multipart/form-data">
                        <div class="mb-3">
                            <input type="file" class="form-control" id="fileInput" required>
                        </div>
                        <button type="submit" class="btn btn-primary">Upload</button>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-md-6">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">Your Files</h5>
                    <div id="filesList">
                        <!-- Files will be listed here -->
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    // Load user's files
    loadFiles();

    // Handle file upload
    document.getElementById('uploadForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const fileInput = document.getElementById('fileInput');
        const file = fileInput.files[0];

        if (!file) {
            alert('Please select a file');
            return;
        }

        try {
            // Get presigned upload URL
            const response = await fetch('/api/s3/upload-url', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ filename: file.name })
            });

            if (!response.ok) {
                throw new Error('Failed to get upload URL');
            }

            const data = await response.json();
            const uploadUrl = data.upload_url;
            const s3Key = data.s3_key;

            // Upload file to S3
            const formData = new FormData();
            formData.append('file', file);

            const uploadResponse = await fetch(uploadUrl, {
                method: 'PUT',
                body: file,
                headers: {
                    'Content-Type': file.type
                }
            });

            if (!uploadResponse.ok) {
                throw new Error('Failed to upload file');
            }

            // Add file to database
            await fetch('/api/s3/files', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    filename: file.name,
                    s3_key: s3Key,
                    content_type: file.type,
                    size_bytes: file.size
                })
            });

            // Clear file input and reload files
            fileInput.value = '';
            loadFiles();

            alert('File uploaded successfully!');
        } catch (error) {
            alert('Error uploading file: ' + error.message);
        }
    });

    // Function to load files
    async function loadFiles() {
        try {
            const response = await fetch('/api/s3/files');
            if (!response.ok) {
                throw new Error('Failed to load files');
            }

            const files = await response.json();
            const filesList = document.getElementById('filesList');
            filesList.innerHTML = '';

            files.forEach(file => {
                const fileElement = document.createElement('div');
                fileElement.className = 'file-item mb-2';
                fileElement.innerHTML = `
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <strong>${file.filename}</strong>
                            <small class="text-muted">Uploaded: ${new Date(file.upload_date).toLocaleString()}</small>
                            <small class="text-muted">Size: ${Math.round(file.size_bytes / 1024)} KB</small>
                        </div>
                        <div>
                            <button class="btn btn-sm btn-primary me-2" onclick="downloadFile('${file.s3_key}')">Download</button>
                            <button class="btn btn-sm btn-danger" onclick="deleteFile('${file.s3_key}')">Delete</button>
                        </div>
                    </div>
                `;
                filesList.appendChild(fileElement);
            });
        } catch (error) {
            console.error('Error loading files:', error);
        }
    }

    // Function to download file
    async function downloadFile(s3Key) {
        try {
            const response = await fetch(`/api/s3/download-url?s3_key=${s3Key}`);
            if (!response.ok) {
                throw new Error('Failed to get download URL');
            }

            const data = await response.json();
            window.location.href = data.download_url;
        } catch (error) {
            alert('Error downloading file: ' + error.message);
        }
    }

    // Function to delete file
    async function deleteFile(s3Key) {
        if (!confirm('Are you sure you want to delete this file?')) {
            return;
        }

        try {
            const response = await fetch('/api/s3/delete', {
                method: 'DELETE',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ s3_key: s3Key })
            });

            if (!response.ok) {
                throw new Error('Failed to delete file');
            }

            loadFiles();
            alert('File deleted successfully!');
        } catch (error) {
            alert('Error deleting file: ' + error.message);
        }
    }
});
</script>
{% endblock %}
