{% extends "base.html" %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-body">
                    <h2 class="card-title text-center mb-4">Subscription Cancelled</h2>
                    <p class="text-center">Your subscription has been cancelled. You can return to the subscription page to try again.</p>
                    <div class="text-center mt-5">
                        <a href="{{ url_for('dashboard.subscription') }}" class="button button-primary">Return to Subscription</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
