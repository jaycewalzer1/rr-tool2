<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketing Materials - CRE: AI Solutions</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            display: flex;
            height: 100vh;
            background-color: #f7f9fb;
        }
        .sidebar {
            width: 240px;
            background-color: #2b6cb0;
            color: white;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .sidebar h2 {
            font-size: 20px;
            margin-bottom: 30px;
        }
        .sidebar a {
            color: white;
            text-decoration: none;
            font-weight: 500;
        }
        .sidebar a:hover {
            text-decoration: underline;
        }
        .main {
            flex-grow: 1;
            padding: 40px;
        }
        .section-header {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 20px;
        }
        .content-box {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
        }
        .upload-box {
            margin-bottom: 30px;
        }
        .list-box {
            margin-top: 30px;
        }
        .list-box h2 {
            margin-bottom: 20px;
        }
        ul {
            list-style: none;
            padding: 0;
        }
        li {
            margin-bottom: 10px;
        }
        li a {
            color: #2b6cb0;
            text-decoration: none;
        }
        li a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>CRE: Dashboard</h2>
        <a href="/dashboard">Home</a>
        <a href="/dashboard/marketing">Marketing Materials</a>
        <a href="/dashboard/database">Master Database</a>
        <a href="/logout">Logout</a>
    </div>
    <div class="main">
        <div class="upload-box">
            <h2>Upload a PDF</h2>
            <form id="uploadForm" enctype="multipart/form-data">
                <input type="file" name="pdf" accept="application/pdf" required>
                <button type="submit">Upload</button>
            </form>
        </div>
        <div class="list-box">
            <h2>Your Uploaded PDFs</h2>
            <div id="pdfList"></div>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', function() {
        // Load user's PDFs when page loads
        loadPDFs();

        // Handle PDF upload
        document.getElementById('uploadForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const fileInput = document.querySelector('input[type="file"][name="pdf"]');
            const file = fileInput.files[0];

            if (!file) {
                console.error('No file selected');
                alert('Please select a PDF file');
                return;
            }

            console.log('=== UPLOAD PROCESS STARTED ===');
            console.log('Selected file:', {
                name: file.name,
                size: file.size,
                type: file.type
            });

            try {
                // Get presigned upload URL
                console.log('=== REQUESTING UPLOAD URL ===');
                const response = await fetch('/api/s3/upload-url', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ filename: file.name })
                });

                console.log('=== UPLOAD URL RESPONSE ===');
                console.log('Status:', response.status);
                console.log('Response:', await response.text());

                if (!response.ok) {
                    throw new Error('Failed to get upload URL');
                }

                const data = await response.json();
                const uploadUrl = data.upload_url;
                const s3Key = data.s3_key;

                console.log('=== GOT UPLOAD URL ===');
                console.log('S3 Key:', s3Key);
                console.log('Upload URL:', uploadUrl);

                // Upload file to S3
                console.log('=== UPLOADING TO S3 ===');
                const uploadResponse = await fetch(uploadUrl, {
                    method: 'PUT',
                    body: file,
                    headers: {
                        'Content-Type': file.type
                    }
                });

                console.log('=== S3 UPLOAD RESPONSE ===');
                console.log('Status:', uploadResponse.status);
                console.log('Response:', await uploadResponse.text());

                if (!uploadResponse.ok) {
                    throw new Error('Failed to upload file');
                }

                // Add file to database
                console.log('=== SAVING TO DATABASE ===');
                await fetch('/api/s3/files', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        filename: file.name,
                        s3_key: s3Key,
                        content_type: file.type,
                        size_bytes: file.size
                    })
                });

                // Clear file input and reload PDFs
                fileInput.value = '';
                loadPDFs();

                console.log('=== UPLOAD COMPLETED SUCCESSFULLY ===');
                alert('PDF uploaded successfully!');
            } catch (error) {
                console.error('=== UPLOAD ERROR ===');
                console.error('Error:', error);
                console.error('Message:', error.message);
                alert('Error uploading PDF: ' + error.message);
            }
        });

        // Function to load PDFs
        async function loadPDFs() {
            console.log('=== LOADING PDFS ===');
            try {
                const response = await fetch('/api/s3/files');
                console.log('=== PDFS RESPONSE ===');
                console.log('Status:', response.status);
                console.log('Response:', await response.text());

                if (!response.ok) {
                    throw new Error('Failed to load PDFs');
                }

                const files = await response.json();
                const pdfList = document.getElementById('pdfList');
                pdfList.innerHTML = '';

                console.log('=== PDFS LOADED ===');
                console.log('Number of files:', files.length);
                console.log('Files:', files);

                if (files.length === 0) {
                    pdfList.innerHTML = '<p class="text-muted">No PDFs uploaded yet.</p>';
                    return;
                }

                files.forEach(file => {
                    const fileElement = document.createElement('div');
                    fileElement.className = 'pdf-item mb-2';
                    fileElement.innerHTML = `
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <strong>${file.filename}</strong>
                                <small class="text-muted">Uploaded: ${new Date(file.upload_date).toLocaleString()}</small>
                                <small class="text-muted">Size: ${Math.round(file.size_bytes / 1024)} KB</small>
                            </div>
                            <div>
                                <button class="btn btn-sm btn-primary me-2" onclick="viewPDF('${file.s3_key}')">View</button>
                                <button class="btn btn-sm btn-danger" onclick="deletePDF('${file.s3_key}')">Delete</button>
                            </div>
                        </div>
                    `;
                    pdfList.appendChild(fileElement);
                });
            } catch (error) {
                console.error('=== PDFS ERROR ===');
                console.error('Error:', error);
                console.error('Message:', error.message);
                alert('Error loading PDFs: ' + error.message);
            }
        }

        // Function to view PDF
        async function viewPDF(s3Key) {
            try {
                const response = await fetch(`/api/s3/download-url?s3_key=${s3Key}`);
                if (!response.ok) {
                    throw new Error('Failed to get download URL');
                }

                const data = await response.json();
                window.open(data.download_url, '_blank');
            } catch (error) {
                alert('Error viewing PDF: ' + error.message);
            }
        }

        // Function to delete PDF
        async function deletePDF(s3Key) {
            if (!confirm('Are you sure you want to delete this PDF?')) {
                return;
            }

            try {
                const response = await fetch('/api/s3/delete', {
                    method: 'DELETE',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ s3_key: s3Key })
                });

                if (!response.ok) {
                    throw new Error('Failed to delete PDF');
                }

                loadPDFs();
                alert('PDF deleted successfully!');
            } catch (error) {
                alert('Error deleting PDF: ' + error.message);
            }
        }
    });
    </script>
</body>
</html>
